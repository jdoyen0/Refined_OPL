<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Links</title>
<style>
  body{background:black;}
  .search-bar-container{position:sticky;top:0;background-color:black;z-index: 10;}
  .search-bar{padding:1rem;justify-content:center;display:flex;}
  #searchInput{padding:20px;width:100%;text-align:center;font-weight:600;color:white;background:black;border:2px solid #baba;border-radius:4px;}
  #searchInput:hover{border:2px solid #ffff;}
  #searchInput:focus{border:2px solid #ffff;box-shadow: 0 0 0 3px #fff;outline:none;}
  ::placeholder {color: white;opacity: 1;}
  .grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));grid-gap:1.25rem;padding:0.75rem 1rem 1rem 1rem;font-family:Montserrat,Arial;font-weight:500;}
  .grid-item{height:100px;border:2px solid #baba;color:white;text-align:center;padding:1rem;border-radius:10px;font-weight:600;display:flex;align-items:center;justify-content:center;background:#000;text-decoration:none;}
  .grid-item:hover, .grid-item:focus, .grid-item:active{border:2px solid #ffff;}
</style>
<!-- Include Fuse.js for fuzzy search -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
</head><body>
<div class="search-bar-container">
  <div class="search-bar"><input id="searchInput" placeholder="Search..." oninput="searchGrid()"></div>
</div>
<div class="grid-container" id="gridContainer">
</div>

<script>
// Searchable links array: [Name, URL]
const links = [
  ["Google", "https://www.google.com/"],
  ["YouTube", "https://www.youtube.com/"],
  ["Facebook", "https://www.facebook.com/"],
  ["ChatGPT", "https://www.chatgpt.com/"],
  ["Instagram", "https://www.instagram.com/"],
  ["Reddit", "https://www.reddit.com/"],
  ["Wikipedia", "https://www.wikipedia.org/"],
  ["X", "https://www.x.com/"],
  ["Yahoo", "https://www.yahoo.com/"],
  ["Amazon", "https://www.amazon.com/"],
  ["Bing", "https://www.bing.com/"],
  ["DuckDuckGo", "https://www.duckduckgo.com/"],
  ["Tiktok", "https://www.tiktok.com/"],
  ["LinkedIn", "https://www.linkedin.com/"],
  ["Office", "https://www.office.com/"],
  ["Netflix", "https://www.netflix.com/"],
  ["Pinterest", "https://www.pinterest.com/"],
  ["Twitch", "https://www.twitch.tv/"],
  ["Canva", "https://www.canva.com/"],
  ["Weather", "https://www.weather.com/"],
  ["Zoom", "https://www.zoom.us/"],
  ["Spotify", "https://www.spotify.com/"],
  ["Apple", "https://www.apple.com/"],
  ["Walmart", "https://www.walmart.com/"],
  ["GitHub", "https://www.github.com/"],
  ["PayPal", "https://www.paypal.com/"],
  ["IMDB", "https://www.imdb.com/"],
  ["Etsy", "https://www.etsy.com/"],
  ["Quora", "https://www.quora.com/"],
  ["Adobe", "https://www.adobe.com/"],
  ["Claude", "https://www.claude.com/"],
  ["Unity", "https://www.unity.com/"]
];

links.sort((a, b) => a[0].localeCompare(b[0]));

let fuse;

function initFuse() {
  const searchData = links.map(([name, url]) => ({ name, url }));

  fuse = new Fuse(searchData, {
    keys: [
      { name: 'name', weight: 0.9 },
      { name: 'url', weight: 0.1 }
    ],
    threshold: 0.4, // Handles typos like "Youtub" or "Gthub"
    ignoreLocation: true
  });
}

function generateGrid(list) {
  const container = document.getElementById('gridContainer');
  if (!container) return;
  container.innerHTML = '';

  list.forEach(([name, url]) => {
    const a = document.createElement('a');
    a.className = 'grid-item';
    a.href = url;
    a.target = '_blank';
    a.textContent = name;
    a.dataset.name = name;
    container.appendChild(a);
  });
}

function searchGrid() {
  const query = document.getElementById("searchInput").value.trim();
  const items = document.querySelectorAll(".grid-item");

  if (!query) {
    items.forEach(item => item.style.display = "");
    return;
  }

  // Multi-term strict token check
  const terms = query.toUpperCase().split(/\s+/);
  
  // Fuzzy search results via Fuse.js
  const fuzzyResults = fuse.search(query).map(res => res.item.name);

  items.forEach(item => {
    const name = item.dataset.name.toUpperCase();

    // Match if all search terms exist in the name OR if Fuse.js fuzzy score matched
    const matchesAllTerms = terms.every(term => name.includes(term));
    const matchesFuzzy = fuzzyResults.includes(item.dataset.name);

    item.style.display = (matchesAllTerms || matchesFuzzy) ? "" : "none";
  });
}

// Initialize grid and Fuse instance on page load
generateGrid(links);
initFuse();

// Press Enter to open the top matching result
document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const topMatch = document.querySelector(".grid-item:not([style*='display: none'])");
    if (topMatch) {
      window.open(topMatch.href, "_blank");
    }
  }
});
</script>
</body></html>
